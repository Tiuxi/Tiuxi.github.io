<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,100,0,0&icon_names=book_2" />
    <script type="module" src="main.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phas-memo-phobia</title>
</head>
<body>
    <header>
        <h1>Phas-memo-phobia</h1>
    </header>

    <main>
        <aside>
            <h2>Ghosts evidences</h2>
        
            <div id="evidenceSelector">
                <article id="temp">
                    <img src="src/thermometer.svg" alt="thermometer">
                    <p>Freezing temperatures</p>
                </article>
                <article id="orb">
                    <img src="src/orb.svg" alt="orb">
                    <p>Ghost orb</p>
                </article>
                <article id="box">
                    <img src="src/radio.svg" alt="radio">
                    <p>Spirit box</p>
                </article>
                <article id="dots">
                    <img src="src/dots.svg" alt="dots">
                    <p>D.O.T.S.</p>
                </article>
                <article id="emf">
                    <img src="src/emfLevel.svg" alt="emf level">
                    <p>EMF 5</p>
                </article>
                <article id="uv">
                    <img src="src/hand.svg" alt="hand">
                    <p>UV fingerprints</p>
                </article>
                <article id="book">
                    <img src="src/book.svg" alt="book">
                    <p>Ghost writing</p>
                </article>
            </div>

            <hr>
            <h2>Ghosts speed</h2>
            <div id="speedSelector">
                <article id="fast">
                    <img src="src/fastWalk.svg" alt="fastWalk">
                    <p>Fast</p>
                </article>
                <article id="normal">
                    <img src="src/normalWalk.svg" alt="normalWalk">
                    <p>Normal</p>
                </article>
                <article id="slow">
                    <img src="src/slowWalk.svg" alt="slowWalk">
                    <p>Slow</p>
                </article>
            </div>
        </aside>

        <span class="hr"><p></p></span>
        
        <section>
            <h2>Ghosts types</h2>
            <div id="ghostsContainer"></div>
            <hr>
            <div id="eliminatedGhosts"></div>
        </section>
    </main>

    <div id="details">
        <article>
            <section class="title">
                <h2></h2>
                <ul></ul>
                <button></button>
            </section>
            <section class="misc">
                <section class="speed"></section>
                <div class="hr"><p></p></div>
                <section class="huntSanity"></section>
                <div class="hr"><p></p></div>
                <section class="forcedEv"></section>
            </section>

            <hr>
            <h3>Traits / abilities :</h3>
            <section class="traits">

            </section>

            <hr>
            <h3>Strategies :</h3>
            <section class="strats">

            </section>
        </article>
    </div>

    <footer>
        <ul>
            <li>Created by Tiuxi.</li>
            <li>Reports problems to <a href="https://github.com/Tiuxi/Tiuxi.github.io" target="_blank">github page</a>.</li>
        </ul>
    </footer>
</body>
</html>
